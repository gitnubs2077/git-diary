<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--
        Content-Security-Policy (defense-in-depth against Markdown-preview XSS).
        connect-src restricts fetch to same-origin + api.github.com so a compromised
        renderer cannot exfiltrate the PAT to a foreign host. 'unsafe-inline' is
        currently required by the inline theme/SW-register scripts and Blazor's
        generated styles; 'wasm-unsafe-eval' is required by the WASM runtime.
        Note: frame-ancestors is intentionally omitted — it is ignored in <meta>
        CSPs by every browser and must be supplied via HTTP headers instead.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.github.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <title>GitDiary</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#7c6fff" />
    <link href="GitDiary.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <script>
        // Theme boot + interop. Runs before the Blazor loader so the persisted (or
        // OS-preferred) theme is applied to <html> before first paint — no dark flash.
        (function () {
            const html = document.documentElement;
            const mql = window.matchMedia('(prefers-color-scheme: dark)');

            function resolve(stored) {
                if (stored === 'light' || stored === 'dark') return stored;
                return mql.matches ? 'dark' : 'light';
            }

            let stored = null;
            try { stored = localStorage.getItem('gitdiary_theme'); } catch (_) { /* ignore */ }
            html.dataset.theme = resolve(stored);

            window.gitdiaryTheme = {
                getSystemPrefersDark: function () { return mql.matches; },
                applyTheme: function (resolved) {
                    if (resolved === 'light' || resolved === 'dark') {
                        html.dataset.theme = resolved;
                    }
                },
                watchSystem: function (dotNetRef) {
                    const handler = function (e) {
                        dotNetRef.invokeMethodAsync('OnSystemThemeChanged', e.matches);
                    };
                    if (mql.addEventListener) {
                        mql.addEventListener('change', handler);
                    } else if (mql.addListener) {
                        mql.addListener(handler);
                    }
                }
            };

            // Sidebar width boot + drag interop. Apply persisted width before first
            // paint so the layout doesn't flash from the CSS default (280px) to the
            // user's saved value.
            const SIDEBAR_MIN = 180;
            const SIDEBAR_MAX = 560;
            const SIDEBAR_DEFAULT = 350;
            const SIDEBAR_KEY = 'gitdiary_sidebar_width';

            function readSidebarWidth() {
                const cs = getComputedStyle(html).getPropertyValue('--sidebar-width');
                const w = parseInt(cs, 10);
                return isNaN(w) ? SIDEBAR_DEFAULT : w;
            }
            function clampSidebar(v) {
                return Math.max(SIDEBAR_MIN, Math.min(SIDEBAR_MAX, v));
            }

            try {
                const storedW = localStorage.getItem(SIDEBAR_KEY);
                if (storedW !== null) {
                    const w = parseInt(storedW, 10);
                    if (!isNaN(w)) {
                        html.style.setProperty('--sidebar-width', clampSidebar(w) + 'px');
                    }
                }
            } catch (_) { /* ignore */ }

            window.gitdiarySidebar = {
                MIN: SIDEBAR_MIN,
                MAX: SIDEBAR_MAX,
                DEFAULT: SIDEBAR_DEFAULT,
                attachResizer: function (handle) {
                    if (!handle || handle._gdAttached) return;
                    handle._gdAttached = true;

                    let dragging = false;
                    let startX = 0;
                    let startW = 0;

                    handle.addEventListener('pointerdown', function (e) {
                        if (e.pointerType === 'mouse' && e.button !== 0) return;
                        dragging = true;
                        startX = e.clientX;
                        startW = readSidebarWidth();
                        try { handle.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
                        document.body.style.cursor = 'col-resize';
                        document.body.style.userSelect = 'none';
                        handle.classList.add('is-dragging');
                        e.preventDefault();
                    });

                    handle.addEventListener('pointermove', function (e) {
                        if (!dragging) return;
                        const w = clampSidebar(startW + (e.clientX - startX));
                        html.style.setProperty('--sidebar-width', w + 'px');
                    });

                    function endDrag(e) {
                        if (!dragging) return;
                        dragging = false;
                        document.body.style.cursor = '';
                        document.body.style.userSelect = '';
                        handle.classList.remove('is-dragging');
                        try { handle.releasePointerCapture(e.pointerId); } catch (_) { /* ignore */ }
                        try { localStorage.setItem(SIDEBAR_KEY, String(readSidebarWidth())); } catch (_) { /* ignore */ }
                    }
                    handle.addEventListener('pointerup', endDrag);
                    handle.addEventListener('pointercancel', endDrag);

                    // Double-click resets to the default width.
                    handle.addEventListener('dblclick', function () {
                        html.style.setProperty('--sidebar-width', SIDEBAR_DEFAULT + 'px');
                        try { localStorage.setItem(SIDEBAR_KEY, String(SIDEBAR_DEFAULT)); } catch (_) { /* ignore */ }
                    });
                }
            };

            // Online-status bridge. When the browser reports `online`, we notify
            // .NET so SyncService can flush pending drafts. `register` is idempotent —
            // subsequent calls are ignored while a handler is already attached.
            window.gitdiaryOnline = {
                _handler: null,
                register: function (dotNetRef) {
                    if (this._handler) return;
                    const self = this;
                    this._handler = function () {
                        try { dotNetRef.invokeMethodAsync('OnBrowserOnline'); }
                        catch (_) { /* .NET side gone */ }
                    };
                    window.addEventListener('online', this._handler);
                },
                unregister: function () {
                    if (this._handler) {
                        window.removeEventListener('online', this._handler);
                        this._handler = null;
                    }
                },
                isOnline: function () { return navigator.onLine !== false; }
            };
        })();
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        // Register the PWA service worker after first paint so it never competes
        // with the WASM boot for bandwidth. Fails silently on unsupported UAs.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('service-worker.js').catch(function () { /* ignore */ });
            });
        }
    </script>
</body>

</html>
