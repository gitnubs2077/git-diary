<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitDiary</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link href="GitDiary.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <script>
        // Theme boot + interop. Runs before the Blazor loader so the persisted (or
        // OS-preferred) theme is applied to <html> before first paint — no dark flash.
        (function () {
            const html = document.documentElement;
            const mql = window.matchMedia('(prefers-color-scheme: dark)');

            function resolve(stored) {
                if (stored === 'light' || stored === 'dark') return stored;
                return mql.matches ? 'dark' : 'light';
            }

            let stored = null;
            try { stored = localStorage.getItem('gitdiary_theme'); } catch (_) { /* ignore */ }
            html.dataset.theme = resolve(stored);

            window.gitdiaryTheme = {
                getSystemPrefersDark: function () { return mql.matches; },
                applyTheme: function (resolved) {
                    if (resolved === 'light' || resolved === 'dark') {
                        html.dataset.theme = resolved;
                    }
                },
                watchSystem: function (dotNetRef) {
                    const handler = function (e) {
                        dotNetRef.invokeMethodAsync('OnSystemThemeChanged', e.matches);
                    };
                    if (mql.addEventListener) {
                        mql.addEventListener('change', handler);
                    } else if (mql.addListener) {
                        mql.addListener(handler);
                    }
                }
            };
        })();
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
