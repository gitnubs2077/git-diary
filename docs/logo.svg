<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="GitDiary logo">
    <title>GitDiary</title>
    <defs>
        <linearGradient id="gd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7c6fff" />
            <stop offset="100%" stop-color="#4b3fbf" />
        </linearGradient>
        <linearGradient id="gd-page" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#e8e8f0" />
        </linearGradient>
        <linearGradient id="gd-spine" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#3a2fa6" />
            <stop offset="100%" stop-color="#2a1f96" />
        </linearGradient>
    </defs>

    <!-- Rounded card background -->
    <rect width="128" height="128" rx="26" ry="26" fill="url(#gd-bg)" />

    <!-- Book drop shadow -->
    <rect x="30" y="26" width="70" height="82" rx="6" ry="6" fill="#1a1b2e" opacity="0.28" />

    <!-- Book pages -->
    <rect x="28" y="22" width="70" height="82" rx="6" ry="6" fill="url(#gd-page)" />

    <!-- Spine binding -->
    <rect x="28" y="22" width="9" height="82" rx="2" ry="2" fill="url(#gd-spine)" />
    <line x1="37" y1="22" x2="37" y2="104" stroke="#231a7a" stroke-width="1" />

    <!-- Bookmark ribbon -->
    <path d="M84 22 v26 l-5.5 -5.5 -5.5 5.5 v-26 z" fill="#ff4757" />

    <!-- Git branch commit graph, drawn on the page -->
    <!-- main trunk -->
    <line x1="50" y1="52" x2="50" y2="92" stroke="#7c6fff" stroke-width="3" stroke-linecap="round" />
    <!-- side branch curve -->
    <path d="M50 66 Q50 78 62 78 L74 78" fill="none" stroke="#958aff" stroke-width="3" stroke-linecap="round" />
    <!-- commit nodes -->
    <circle cx="50" cy="52" r="5" fill="#7c6fff" />
    <circle cx="50" cy="92" r="5" fill="#7c6fff" />
    <circle cx="78" cy="78" r="5" fill="#958aff" />
</svg>
